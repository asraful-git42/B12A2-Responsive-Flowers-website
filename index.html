<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <nav>
        <img src="assets/logo.png" alt="logo" />
        <ul>
          <a class="active" href="#">Home</a>
          <a href="#">Shop</a>
          <a href="#">About us</a>
          <div class="cart">
            <img src="assets/shopping-cart-line.png" alt="cart" />
            <span>Cart ($56)</span>
          </div>
        </ul>
      </nav>
      <!-- hero-section -->
      <section class="hero">
        <div class="hero-left">
          <h1 class="hero-header">
            ALWAYS <span>FRESH<br />FLOWERS</span>
          </h1>
          <p class="hero-text">
            Indulge your senses with the beauty and fragrance of our fresh
            flower shop. From classic roses to exotic blooms, we offer a wide
            variety of fresh flowers that are perfect for any occasion.
          </p>
        </div>
        <div class="hero-right">
          <img src="assets/hero-flower.png" alt="image" />
        </div>
      </section>
    </header>
  </body>
</html>
